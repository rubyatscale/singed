# release-please keeps a release PR open that bumps lib/singed/version.rb and
# CHANGELOG.md from the Conventional Commits merged to main. Merging it creates
# the tag and GitHub release, and the release job then publishes the gem to
# RubyGems.org with trusted publishing (OIDC). To retry a failed publish,
# re-run the failed jobs of that workflow run.
#
# Publishing happens in this run rather than on `release: published`, because a
# release created with GITHUB_TOKEN doesn't trigger other workflows. The filename
# and the rubygems.org environment are what the trusted publisher on
# RubyGems.org is registered against, so don't rename either.
name: Push Gem

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: push-gem
  cancel-in-progress: false

jobs:
  release-please:
    name: Update the release PR or create a release
    if: github.repository == 'rubyatscale/singed'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag and GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Publish to RubyGems
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/singed

    permissions:
      contents: write # `rake release` pushes the branch and the tag release-please created
      id-token: write # trusted publishing

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      # `rake release` pushes the current branch along with the tag, so this has to be a
      # branch checkout rather than a detached HEAD at the release commit. The push needs no
      # persisted credentials: release-gem puts the token in git's credential cache for it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Confirm main is still the release commit
        env:
          SHA: ${{ github.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "::error::main moved from the release commit $SHA to $head before publishing, so this run can't publish it."
            exit 1
          fi
      # No bundler cache here: a job that publishes the gem shouldn't restore one.
      - name: Set up Ruby
        uses: ruby/setup-ruby@2e007403fc1ec238429ecaa57af6f22f019cc135 # v1.234.0
        with:
          ruby-version: ruby
      - run: bundle install

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

  notify_on_failure:
    name: Notify on failure
    needs: [release-please, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.repository }} Push Gem workflow FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
